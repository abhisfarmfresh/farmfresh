<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produce Catalogue | Abhis Farm Fresh B2B</title>
    <meta name="description" content="Wholesale produce catalogue including fresh vegetables, organic fruits, hydroponics, and farm dairy.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#f6f9f6] text-slate-900 min-h-screen flex flex-col pb-16 md:pb-0">

    <header class="glass-nav sticky top-0 z-50 border-b border-slate-200/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="images/logo.png" alt="Logo" class="h-10 w-auto">
                <div class="font-extrabold text-lg text-emerald-950">Abhis Farm Fresh</div>
            </a>
            <nav class="hidden md:flex items-center gap-7 text-xs font-bold text-slate-700">
                <a href="index.html">Home</a>
                <a href="products.html" class="text-emerald-800">Catalogue</a>
                <a href="enquiry.html">Bulk Quote Builder</a>
                <a href="orders.html">My Orders</a>
                <a href="contact.html">Contact Us</a>
                <a href="admin/index.html" class="bg-slate-100 px-3 py-1.5 rounded-lg border">Admin CRM</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">
        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-2xl font-extrabold text-slate-900">Wholesale Produce Catalogue</h1>
                    <p class="text-xs text-slate-500">Filter by category or search produce items. Tap '+' to adjust bulk quantities.</p>
                </div>
                <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                    <input type="text" id="catalog-search" class="px-4 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:border-emerald-800" placeholder="Search produce...">
                    <select id="catalog-sort" class="py-2 px-3 border border-slate-200 rounded-xl text-xs font-medium">
                        <option value="default">Sort by: Featured</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="moq-low">MOQ: Lowest First</option>
                    </select>
                </div>
            </div>

            <!-- Categories Tabs Bar -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pt-2 border-t border-slate-100" id="category-tabs"></div>
        </div>

        <!-- Produce Grid -->
        <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Flipkart / Amazon Style Mobile Navigation Bar -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md border-t border-slate-200 px-2 py-1.5 shadow-2xl flex justify-around items-center">
        <a href="index.html" class="flex flex-col items-center gap-0.5 text-[10px] font-bold text-slate-500 hover:text-emerald-800">
            <span class="material-symbols-outlined text-xl">home</span>
            <span>Home</span>
        </a>
        <a href="products.html" class="flex flex-col items-center gap-0.5 text-[10px] font-bold text-emerald-800">
            <span class="material-symbols-outlined text-xl">grid_view</span>
            <span>Categories</span>
        </a>
        <a href="enquiry.html" class="flex flex-col items-center gap-0.5 text-[10px] font-bold text-slate-500 hover:text-emerald-800 relative">
            <span class="material-symbols-outlined text-xl">shopping_cart</span>
            <span id="mobile-cart-badge" class="absolute -top-1 right-2 bg-emerald-700 text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span>
            <span>Quotes</span>
        </a>
        <a href="orders.html" class="flex flex-col items-center gap-0.5 text-[10px] font-bold text-slate-500 hover:text-emerald-800">
            <span class="material-symbols-outlined text-xl">receipt_long</span>
            <span>Orders</span>
        </a>
        <a href="admin/index.html" class="flex flex-col items-center gap-0.5 text-[10px] font-bold text-slate-500 hover:text-emerald-800">
            <span class="material-symbols-outlined text-xl">person</span>
            <span>Account</span>
        </a>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
