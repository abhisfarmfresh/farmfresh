<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin CRM Login | Abhis Farm Fresh</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/admin.css">

    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl p-8 sm:p-10 w-full max-w-md shadow-2xl border border-slate-800 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-gradient-to-br from-emerald-800 to-emerald-950 rounded-2xl mx-auto p-2.5 shadow-lg flex items-center justify-center mb-3">
                <img src="../images/logo.png" alt="Abhis Farm Fresh Logo" class="h-full w-auto object-contain">
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Abhis Farm Fresh</h1>
            <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider">Executive CRM Operations Panel</p>
        </div>

        <!-- Info / Expiry Banner -->
        <div id="login-notice-banner" class="hidden text-xs font-semibold bg-amber-50 text-amber-800 p-3 rounded-xl border border-amber-200 flex items-center gap-2">
            <span class="material-symbols-outlined text-base text-amber-600 flex-shrink-0">schedule</span>
            <span id="login-notice-text">Your session expired. Please enter your password to continue.</span>
        </div>

        <!-- Login Form -->
        <form id="admin-login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1" for="login-email">Admin Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none">mail</span>
                    <input type="email" id="login-email" required 
                           class="admin-input pl-9" placeholder="admin@abhisfarmfresh.com" autocomplete="username">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1" for="login-password">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-base pointer-events-none">lock</span>
                    <input type="password" id="login-password" required 
                           class="admin-input pl-9 pr-10" placeholder="••••••••" autocomplete="current-password" autofocus>
                    <button type="button" id="toggle-password-btn" 
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 p-1 focus:outline-none"
                            title="Show/Hide Password">
                        <span class="material-symbols-outlined text-base" id="toggle-password-icon">visibility</span>
                    </button>
                </div>
            </div>

            <!-- Error Banner -->
            <div id="login-error-banner" class="hidden text-xs font-bold text-red-600 bg-red-50 p-3 rounded-xl border border-red-200 flex items-center gap-2">
                <span class="material-symbols-outlined text-base flex-shrink-0">error</span>
                <span id="login-error-text">Invalid login credentials.</span>
            </div>

            <button type="submit" id="login-submit-btn" 
                    class="admin-btn admin-btn-primary w-full py-3 rounded-xl text-xs font-extrabold shadow-md flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-sm">lock_open</span>
                <span>Sign In to Admin CRM</span>
            </button>
        </form>

        <!-- Navigation Note -->
        <div class="pt-4 border-t border-slate-100 text-center text-[11px] text-slate-400 space-y-2">
            <div>
                <a href="../index.html" class="text-emerald-700 hover:underline font-semibold flex items-center justify-center gap-1">
                    <span class="material-symbols-outlined text-sm">arrow_back</span>
                    <span>Back to Customer Website</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../shared/js/config.js"></script>
    <script src="../shared/js/firebase-init.js"></script>
    <script src="js/admin-auth.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const reason = urlParams.get('reason');
        const noticeBanner = document.getElementById('login-notice-banner');
        const noticeText = document.getElementById('login-notice-text');
        const emailInput = document.getElementById('login-email');
        const passInput = document.getElementById('login-password');
        const toggleBtn = document.getElementById('toggle-password-btn');
        const toggleIcon = document.getElementById('toggle-password-icon');

        if (reason === 'expired') {
            noticeText.textContent = 'Your session expired due to inactivity. Please log in again.';
            noticeBanner.classList.remove('hidden');
        } else if (urlParams.get('redirect')) {
            noticeText.textContent = 'Please enter your password to access the Admin CRM.';
            noticeBanner.classList.remove('hidden');
        }

        // Restore previously typed email if remembered by user's browser, otherwise keep empty
        const savedEmail = localStorage.getItem('aff_last_admin_email');
        if (emailInput && savedEmail && !emailInput.value) {
            emailInput.value = savedEmail;
        }

        if (toggleBtn && passInput && toggleIcon) {
            toggleBtn.addEventListener('click', () => {
                if (passInput.type === 'password') {
                    passInput.type = 'text';
                    toggleIcon.textContent = 'visibility_off';
                } else {
                    passInput.type = 'password';
                    toggleIcon.textContent = 'visibility';
                }
            });
        }

        if (passInput && (!emailInput || emailInput.value)) {
            passInput.focus();
        } else if (emailInput) {
            emailInput.focus();
        }
    });

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;
        const btn = document.getElementById('login-submit-btn');
        const errBanner = document.getElementById('login-error-banner');
        const errText = document.getElementById('login-error-text');

        errBanner.classList.add('hidden');
        btn.disabled = true;
        btn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span> Signing in...`;

        try {
            const res = await AdminAuth.login(email, pass);

            if (res.success) {
                localStorage.setItem('aff_last_admin_email', email.trim());
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect');
                let target = 'index.html';
                if (redirect) {
                    target += redirect.startsWith('#') ? redirect : ('#' + redirect);
                }
                window.location.replace(target);
            } else {
                errText.textContent = res.error || 'Invalid credentials. Please verify your email and password.';
                errBanner.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = `<span class="material-symbols-outlined text-sm">lock_open</span><span>Sign In to Admin CRM</span>`;
            }
        } catch (err) {
            errText.textContent = err.message || 'Authentication error occurred.';
            errBanner.classList.remove('hidden');
            btn.disabled = false;
            btn.innerHTML = `<span class="material-symbols-outlined text-sm">lock_open</span><span>Sign In to Admin CRM</span>`;
        }
    });
    </script>
</body>
</html>
