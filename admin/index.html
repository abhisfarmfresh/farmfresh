<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Abhis Farm Fresh B2B CRM</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl p-8 sm:p-10 w-full max-w-md shadow-2xl border border-slate-700/50 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-emerald-800 rounded-2xl mx-auto p-2.5 shadow-lg flex items-center justify-center mb-3">
                <img src="../images/logo.png" alt="Abhis Farm Fresh Logo" class="h-full w-auto object-contain">
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Abhis Farm Fresh</h1>
            <p class="text-xs text-slate-500 font-semibold">B2B Admin CRM Operations Panel</p>
        </div>

        <form id="admin-login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Username</label>
                <input type="text" id="login-user" value="admin" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-xs outline-none focus:border-emerald-800">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="login-pass" value="admin123" required class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-xs outline-none focus:border-emerald-800">
            </div>

            <div id="login-error" class="hidden text-xs font-bold text-red-600 bg-red-50 p-2.5 rounded-lg border border-red-200">
                Invalid Username or Password. Try admin / admin123
            </div>

            <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-extrabold py-3 px-4 rounded-xl text-xs shadow-md transition-colors">
                Sign In to Admin CRM
            </button>
        </form>

        <div class="pt-4 border-t border-slate-100 text-center text-[11px] text-slate-400">
            Demo Admin Credentials: <strong class="text-slate-700">admin</strong> / <strong class="text-slate-700">admin123</strong>
            <div class="mt-2">
                <a href="../index.html" class="text-emerald-700 hover:underline font-semibold">&larr; Back to Public Website</a>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        document.getElementById('admin-login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;

            if (AdminAuth.login(u, p)) {
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
